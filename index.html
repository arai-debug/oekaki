<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#E7EDE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B221C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おえかき">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root {
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>おえかきちょう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  :root {
    --bg: #E7EDE3;
    --bg-deep: #DAE3D4;
    --surface: #FFFFFF;
    --paper: #FFFFFF;
    --ink: #2C332C;
    --ink-soft: #6B7568;
    --line: #C7D2C0;
    --crayon: #DD5540;
    --crayon-deep: #B33F2D;
    --ochre: #EDB230;
    --teal: #2F8A86;
    --shadow: rgba(44, 51, 44, 0.16);

    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 11px;

    --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B221C;
      --bg-deep: #141A15;
      --surface: #273027;
      --ink: #E8EFE5;
      --ink-soft: #9DA89A;
      --line: #3B473B;
      --crayon: #F0674F;
      --crayon-deep: #C24630;
      --ochre: #F5C355;
      --teal: #45A9A4;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1B221C;
    --bg-deep: #141A15;
    --surface: #273027;
    --ink: #E8EFE5;
    --ink-soft: #9DA89A;
    --line: #3B473B;
    --crayon: #F0674F;
    --crayon-deep: #C24630;
    --ochre: #F5C355;
    --teal: #45A9A4;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 500;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 12px;
    box-sizing: border-box;
  }

  .view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 10px;
  }

  [hidden] { display: none !important; }

  /* ---- buttons ---- */
  button {
    font-family: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    border-radius: var(--r-md);
    padding: 12px 16px;
    font-size: 17px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .08s ease;
  }
  button:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .btn-main {
    background: var(--crayon);
    border-color: var(--crayon-deep);
    color: #FFF8F5;
    font-size: 21px;
    font-weight: 900;
    padding: 16px;
    border-radius: var(--r-lg);
  }

  .btn-row { display: flex; gap: 8px; }
  .btn-row > button { flex: 1; }

  /* ---- top bar ---- */
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  .bar .spacer { flex: 1; }

  .icon-btn {
    width: 46px;
    height: 46px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 14px;
    flex: 0 0 auto;
  }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.on { background: var(--ochre); border-color: #B8851A; color: #33280A; }

  /* ---- おだい ---- */
  .eyebrow {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--ink-soft);
  }

  .odai-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 24px 20px;
    box-shadow: 0 6px 0 var(--shadow);
  }

  .odai-text {
    font-size: clamp(26px, 8.5vw, 38px);
    font-weight: 900;
    line-height: 1.5;
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: break-word;
    margin: 0;
  }

  .crayon-strip {
    display: flex;
    gap: 5px;
  }
  .crayon-strip i {
    display: block;
    width: 16px;
    height: 7px;
    border-radius: 4px;
  }

  .app-title {
    font-size: 19px;
    font-weight: 900;
    margin: 0;
  }

  /* ---- おえかき ---- */
  .odai-bar {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .canvas-wrap {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
  }

  canvas#pad {
    max-height: 100%;
    max-width: 100%;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: 0 4px 0 var(--shadow);
    touch-action: none;
    display: block;
  }

  .colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
  }
  .swatch {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 3px solid var(--surface);
    box-shadow: 0 0 0 2px var(--line);
    padding: 0;
    min-width: 0;
  }
  .swatch[aria-pressed="true"] {
    box-shadow: 0 0 0 3px var(--ink);
    transform: scale(1.08);
  }

  .tools {
    display: grid;
    grid-template-columns: repeat(3, 1fr) repeat(3, 46px);
    gap: 7px;
    align-items: center;
  }
  .size-btn {
    padding: 0;
    height: 46px;
    display: grid;
    place-items: center;
  }
  .size-btn span {
    display: block;
    border-radius: 50%;
    background: var(--ink);
  }
  .size-btn[aria-pressed="true"] { background: var(--bg-deep); border-color: var(--ink-soft); }

  /* ---- ほんだな ---- */
  .shelf-grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    align-content: start;
    padding-bottom: 8px;
  }
  .shelf-item {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: var(--r-md);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    box-shadow: 0 3px 0 var(--shadow);
    font: inherit;
    text-align: left;
  }
  .shelf-item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: var(--r-sm);
    background: var(--paper);
    display: block;
  }
  .shelf-item b {
    word-break: keep-all;
    overflow-wrap: break-word;
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .shelf-item small { font-size: 11px; color: var(--ink-soft); font-weight: 700; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 40px 12px;
    line-height: 1.9;
  }

  /* ---- おおきく みる ---- */
  #zoom {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 21, .82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    z-index: 20;
  }
  #zoom img {
    max-width: 100%;
    max-height: 70%;
    border-radius: var(--r-md);
    background: var(--paper);
  }
  #zoom p { color: #F4F7F2; font-weight: 900; font-size: 19px; margin: 0; text-align: center; text-wrap: balance; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    font-weight: 900;
    font-size: 17px;
    padding: 12px 22px;
    border-radius: 999px;
    z-index: 30;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>

</head>
<body>
<div id="app">

  <!-- ===== おだい ===== -->
  <section class="view" id="v-odai">
    <div class="bar">
      <h1 class="app-title">おえかきちょう</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="bgm-1" aria-label="おんがく">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      </button>
      <button class="icon-btn" id="go-shelf-1" aria-label="ほんだな">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      </button>
    </div>

    <div class="odai-card">
      <span class="eyebrow">きょうの おだい</span>
      <p class="odai-text" id="odai-text">まほうを つかう ねこ</p>
      <div class="crayon-strip" aria-hidden="true">
        <i style="background:#DD5540"></i><i style="background:#EDB230"></i><i style="background:#79B04A"></i>
        <i style="background:#3E8FD0"></i><i style="background:#8B62C4"></i><i style="background:#E87BA6"></i>
      </div>
    </div>

    <button class="btn-main" id="start-draw">これを かく</button>
    <button id="reroll">べつの おだい</button>
  </section>

  <!-- ===== おえかき ===== -->
  <section class="view" id="v-draw" hidden>
    <div class="bar">
      <button class="icon-btn" id="back-odai" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span class="odai-bar" id="odai-mini"></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="bgm-2" aria-label="おんがく">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      </button>
    </div>

    <div class="canvas-wrap"><canvas id="pad" width="1200" height="1200"></canvas></div>

    <div class="colors" id="colors"></div>

    <div class="tools">
      <button class="size-btn" data-size="14" aria-pressed="false" aria-label="ほそい"><span style="width:8px;height:8px"></span></button>
      <button class="size-btn" data-size="30" aria-pressed="true" aria-label="ふつう"><span style="width:15px;height:15px"></span></button>
      <button class="size-btn" data-size="60" aria-pressed="false" aria-label="ふとい"><span style="width:24px;height:24px"></span></button>
      <button class="icon-btn" id="eraser" aria-pressed="false" aria-label="けしゴム">
        <svg viewBox="0 0 24 24"><path d="M4 16.5 11.5 9l6 6-4 4H7z"/><path d="M11.5 9 16 4.5a1.5 1.5 0 0 1 2.1 0l3.4 3.4a1.5 1.5 0 0 1 0 2.1L17.5 15"/><path d="M5 20h15"/></svg>
      </button>
      <button class="icon-btn" id="undo" aria-label="ひとつ もどす">
        <svg viewBox="0 0 24 24"><path d="M4 8h10a5 5 0 0 1 0 10H8"/><path d="M8 4 4 8l4 4"/></svg>
      </button>
      <button class="icon-btn" id="clear" aria-label="ぜんぶ けす">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 12h8l1-12"/></svg>
      </button>
    </div>

    <button class="btn-main" id="done">かんせい!</button>
  </section>

  <!-- ===== ほんだな ===== -->
  <section class="view" id="v-shelf" hidden>
    <div class="bar">
      <button class="icon-btn" id="back-odai-2" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="app-title">ほんだな</h1>
      <div class="spacer"></div>
      <span class="eyebrow" id="shelf-count"></span>
    </div>
    <div class="shelf-grid" id="shelf"></div>
  </section>

</div>

<script>
(function () {
  "use strict";

  /* ========== おだい ========== */
  var ODAI = [
    "まほうを つかう ねこ", "そらを とぶ おうち", "おんがくが すきな きょうりゅう",
    "にじの うえを あるく ひと", "ケーキで できた おしろ", "めがねを かけた さかな",
    "ピアノを ひく うさぎ", "かさを さした ぞう", "ゆきだるまの かぞく",
    "ほしを つりあげる ふね", "はなびを みている いぬ", "パンやさんの ねずみ",
    "うみの そこの ゆうえんち", "ながぐつを はいた とり", "おかしの もり",
    "じてんしゃに のる くま", "ぼうしが とんでいく ひ", "つきに すむ うさぎの いえ",
    "かめの せなかの まち", "アイスクリームの やま", "はなを そだてる ロボット",
    "かさの したの ちいさな むし", "きょうりゅうと おさんぽ", "くもを たべる りゅう",
    "ふうせんで たびする ねこ", "えんぴつの おうこく", "おふろに はいる ペンギン",
    "でんしゃが はしる にじ", "ぼうけんに でる かたつむり", "おほしさまの おんがくかい",
    "まほうの ぼうしやさん", "うみを およぐ ぞう", "たからばこを あけた ひ",
    "きょうりゅうの たんじょうび", "そらいろの きりん", "ゆめの なかの きょうしつ",
    "パジャマを きた くま", "おはなを かぶった かえる", "たこやきの うちゅうせん",
    "まいごの こうもり", "かぜと おどる きのは", "おかしを はこぶ あり",
    "ゆうえんちの かんらんしゃ", "ながい かみの おひめさま", "ほしぞらの したの テント",
    "なみに のる ペンギン", "くだものの しま", "じかんを とめる とけい",
    "おんぷが とびだす ピアノ", "きょうだいの ロボット", "くつが おおきい ピエロ",
    "ゆきの ふる もり", "まほうの ほうき", "かいだんを のぼる かたつむり",
    "おおきな きの おうち", "うちゅうひこうしの ねこ", "さかさまの まち",
    "わたあめの くも", "おばけの がっこう", "ちいさな りゅうの たまご",
    "ひまわりばたけの おひるね", "てがみを はこぶ とり", "おうかんを かぶった かめ",
    "まほうの えのぐ", "なつまつりの よる", "うみの いろの ドレス",
    "やさいの パレード", "ねむって いる やま", "おんがくを つくる かぜ",
    "だいすきな ひとの かお"
  ];

  var COLORS = [
    "#2B2B33", "#DD5540", "#EF8B3C", "#EDB230", "#79B04A", "#2F8A5C",
    "#3FB0CE", "#3E70D0", "#8B62C4", "#E87BA6", "#9A6A44", "#7E8C96"
  ];

  var PAPER = "#FFFFFF";

  function $(id) { return document.getElementById(id); }

  /* ========== ほぞん(この iPhone のなか) ========== */
  var STORE = "pics", DBN = "oekaki-cho";
  var memFallback = [];

  function openDB() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error("no-idb")); return; }
      var r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = function () {
        if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE, { keyPath: "id" });
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }

  function savePic(pic) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, "readwrite");
        t.objectStore(STORE).put(pic);
        t.oncomplete = function () { res(); };
        t.onerror = function () { rej(t.error); };
      });
    })["catch"](function () { memFallback.push(pic); });
  }

  function loadPics() {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, "readonly");
        var q = t.objectStore(STORE).getAll();
        q.onsuccess = function () { res(q.result || []); };
        q.onerror = function () { rej(q.error); };
      });
    })["catch"](function () { return memFallback.slice(); });
  }

  function pref(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    } catch (e) { /* プライベートブラウズ等。きにしない */ }
    return null;
  }

  /* ========== BGM(おとを つくる) ========== */
  var actx = null, masterGain = null, bgmOn = false, schedTimer = null;
  var nextTime = 0, stepIdx = 0;
  var BEAT = 0.5; // 8ぶおんぷ 1つぶんの ながさ(びょう)

  // C - Am - F - G を くりかえす
  var CHORDS = [
    [261.63, 329.63, 392.00, 523.25],
    [220.00, 261.63, 329.63, 440.00],
    [174.61, 261.63, 349.23, 440.00],
    [196.00, 246.94, 392.00, 493.88]
  ];
  var MELODY = [523.25, 587.33, 659.25, 783.99, 880.00];

  function ensureAudio() {
    if (actx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      actx = new AC();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.16;
      masterGain.connect(actx.destination);
    } catch (e) { actx = null; return false; }
    return true;
  }

  // ピアノっぽい おと(サイン + うすい ばいおん、すぐ きえる)
  function pluck(freq, at, dur, vel) {
    if (!actx) return;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vel, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    g.connect(masterGain);

    var o1 = actx.createOscillator();
    o1.type = "sine";
    o1.frequency.value = freq;
    o1.connect(g);

    var g2 = actx.createGain();
    g2.gain.value = 0.22;
    g2.connect(g);
    var o2 = actx.createOscillator();
    o2.type = "triangle";
    o2.frequency.value = freq * 2;
    o2.connect(g2);

    o1.start(at); o2.start(at);
    o1.stop(at + dur + 0.05); o2.stop(at + dur + 0.05);
  }

  function scheduler() {
    if (!actx) return;
    while (nextTime < actx.currentTime + 0.35) {
      var bar = Math.floor(stepIdx / 8) % CHORDS.length;
      var ch = CHORDS[bar];
      var pos = stepIdx % 8;
      // アルペジオ
      pluck(ch[pos % 4], nextTime, 1.4, 0.16);
      // ときどき メロディ
      if (pos === 0 || pos === 5) {
        var m = MELODY[(stepIdx * 3 + bar) % MELODY.length];
        pluck(m, nextTime + (pos === 5 ? 0.12 : 0), 1.8, 0.12);
      }
      // ひくい おと
      if (pos === 0) pluck(ch[0] / 2, nextTime, 2.2, 0.13);
      nextTime += BEAT;
      stepIdx++;
    }
  }

  function startBGM() {
    if (!ensureAudio()) return false;
    if (actx.state === "suspended") actx.resume();
    if (schedTimer) return true;
    nextTime = actx.currentTime + 0.1;
    schedTimer = setInterval(scheduler, 80);
    return true;
  }

  function stopBGM() {
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
  }

  function chime() {
    if (!ensureAudio()) return;
    if (actx.state === "suspended") actx.resume();
    var t = actx.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.50].forEach(function (f, i) {
      pluck(f, t + i * 0.09, 1.1, 0.2);
    });
  }

  var bgmBtns = [$("bgm-1"), $("bgm-2")];
  function paintBGM() {
    bgmBtns.forEach(function (b) {
      b.classList.toggle("on", bgmOn);
      b.setAttribute("aria-label", bgmOn ? "おんがくを とめる" : "おんがくを ながす");
    });
  }
  function toggleBGM() {
    bgmOn = !bgmOn;
    if (bgmOn) { if (!startBGM()) bgmOn = false; } else { stopBGM(); }
    pref("bgm", bgmOn ? "1" : "0");
    paintBGM();
  }
  bgmBtns.forEach(function (b) { b.addEventListener("click", toggleBGM); });
  if (pref("bgm") === "1") { bgmOn = true; paintBGM(); } // さいしょの タップで おとが でる

  function wakeAudioIfWanted() {
    if (bgmOn && !schedTimer) startBGM();
  }

  /* ========== がめんの きりかえ ========== */
  var views = { odai: $("v-odai"), draw: $("v-draw"), shelf: $("v-shelf") };
  function show(name) {
    Object.keys(views).forEach(function (k) { views[k].hidden = (k !== name); });
    if (name === "draw") sizeCanvas();
    if (name === "shelf") renderShelf();
  }

  /* ========== おだい ========== */
  var currentOdai = ODAI[Math.floor(Math.random() * ODAI.length)];
  function paintOdai() {
    $("odai-text").textContent = currentOdai;
    $("odai-mini").textContent = currentOdai;
  }
  paintOdai();

  $("reroll").addEventListener("click", function () {
    var next = currentOdai;
    while (next === currentOdai) next = ODAI[Math.floor(Math.random() * ODAI.length)];
    currentOdai = next;
    paintOdai();
    wakeAudioIfWanted();
  });

  $("start-draw").addEventListener("click", function () {
    strokes = []; redrawAll();
    show("draw");
    wakeAudioIfWanted();
  });

  $("go-shelf-1").addEventListener("click", function () { show("shelf"); wakeAudioIfWanted(); });
  $("back-odai").addEventListener("click", function () { show("odai"); });
  $("back-odai-2").addEventListener("click", function () { show("odai"); });

  /* ========== おえかき ========== */
  var pad = $("pad");
  var g = pad.getContext("2d");
  var S = 1200;
  var strokes = [];
  var cur = null;
  var color = COLORS[0];
  var size = 30;
  var erasing = false;

  function sizeCanvas() { /* CSS が おおきさを きめる。なかみは 1200x1200 で こてい */ }

  function clearPad() {
    g.fillStyle = PAPER;
    g.fillRect(0, 0, S, S);
  }

  function strokeLine(st, a, b) {
    g.strokeStyle = st.color;
    g.lineWidth = st.w;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.beginPath();
    g.moveTo(a.x * S, a.y * S);
    g.lineTo(b.x * S, b.y * S);
    g.stroke();
  }

  function strokeDot(st, p) {
    g.fillStyle = st.color;
    g.beginPath();
    g.arc(p.x * S, p.y * S, st.w / 2, 0, Math.PI * 2);
    g.fill();
  }

  function redrawAll() {
    clearPad();
    for (var i = 0; i < strokes.length; i++) {
      var st = strokes[i];
      strokeDot(st, st.pts[0]);
      for (var j = 1; j < st.pts.length; j++) strokeLine(st, st.pts[j - 1], st.pts[j]);
    }
  }
  clearPad();

  function pos(e) {
    var r = pad.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    };
  }

  pad.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    cur = { color: erasing ? PAPER : color, w: erasing ? size * 1.8 : size, pts: [pos(e)] };
    strokes.push(cur);
    strokeDot(cur, cur.pts[0]);
    resetClearConfirm();
    wakeAudioIfWanted();
  });

  pad.addEventListener("pointermove", function (e) {
    if (!cur) return;
    e.preventDefault();
    var p = pos(e);
    var last = cur.pts[cur.pts.length - 1];
    if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) < 0.002) return;
    cur.pts.push(p);
    strokeLine(cur, last, p);
  });

  function endStroke() { cur = null; }
  pad.addEventListener("pointerup", endStroke);
  pad.addEventListener("pointercancel", endStroke);
  pad.addEventListener("pointerleave", endStroke);

  /* いろ */
  var colorsBox = $("colors");
  COLORS.forEach(function (c, i) {
    var b = document.createElement("button");
    b.className = "swatch";
    b.style.background = c;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.setAttribute("aria-label", "いろ " + (i + 1));
    b.addEventListener("click", function () {
      color = c;
      erasing = false;
      $("eraser").setAttribute("aria-pressed", "false");
      $("eraser").classList.remove("on");
      Array.prototype.forEach.call(colorsBox.children, function (el) { el.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      wakeAudioIfWanted();
    });
    colorsBox.appendChild(b);
  });

  /* ふとさ */
  var sizeBtns = document.querySelectorAll(".size-btn");
  Array.prototype.forEach.call(sizeBtns, function (b) {
    b.addEventListener("click", function () {
      size = parseInt(b.dataset.size, 10);
      Array.prototype.forEach.call(sizeBtns, function (o) { o.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      wakeAudioIfWanted();
    });
  });

  /* けしゴム */
  $("eraser").addEventListener("click", function () {
    erasing = !erasing;
    $("eraser").setAttribute("aria-pressed", erasing ? "true" : "false");
    $("eraser").classList.toggle("on", erasing);
    wakeAudioIfWanted();
  });

  /* もどす */
  $("undo").addEventListener("click", function () {
    strokes.pop();
    redrawAll();
    resetClearConfirm();
    wakeAudioIfWanted();
  });

  /* ぜんぶけす(2かい おす) */
  var clearArmed = false, clearTimer = null;
  function resetClearConfirm() {
    clearArmed = false;
    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
    $("clear").classList.remove("on");
  }
  $("clear").addEventListener("click", function () {
    wakeAudioIfWanted();
    if (!clearArmed) {
      clearArmed = true;
      $("clear").classList.add("on");
      toast("もういちど おすと ぜんぶ きえます");
      clearTimer = setTimeout(resetClearConfirm, 2600);
      return;
    }
    strokes = [];
    redrawAll();
    resetClearConfirm();
  });

  /* ========== かんせい ========== */
  $("done").addEventListener("click", function () {
    wakeAudioIfWanted();
    if (strokes.length === 0) { toast("まだ なにも かいて いません"); return; }

    var full = pad.toDataURL("image/png");
    var tc = document.createElement("canvas");
    tc.width = 360; tc.height = 360;
    var tg = tc.getContext("2d");
    tg.fillStyle = PAPER; tg.fillRect(0, 0, 360, 360);
    tg.drawImage(pad, 0, 0, 360, 360);
    var thumb = tc.toDataURL("image/png");

    var now = new Date();
    var pic = {
      id: String(now.getTime()),
      odai: currentOdai,
      date: now.getFullYear() + "ねん " + (now.getMonth() + 1) + "がつ " + now.getDate() + "にち",
      img: full,
      thumb: thumb
    };

    savePic(pic).then(function () {
      chime();
      toast("ほんだなに しまいました");
      strokes = []; redrawAll();
      var next = currentOdai;
      while (next === currentOdai) next = ODAI[Math.floor(Math.random() * ODAI.length)];
      currentOdai = next;
      paintOdai();
      show("shelf");
    });
  });

  /* ========== ほんだな ========== */
  function renderShelf() {
    var box = $("shelf");
    loadPics().then(function (list) {
      list.sort(function (a, b) { return Number(b.id) - Number(a.id); });
      box.textContent = "";
      $("shelf-count").textContent = list.length ? list.length + "まい" : "";

      if (!list.length) {
        var e = document.createElement("div");
        e.className = "empty";
        e.textContent = "まだ 1まいも ありません。おだいの がめんから かいてみよう。";
        box.appendChild(e);
        return;
      }

      list.forEach(function (p) {
        var b = document.createElement("button");
        b.className = "shelf-item";
        var im = document.createElement("img");
        im.src = p.thumb || p.img;
        im.alt = p.odai;
        var t = document.createElement("b");
        t.textContent = p.odai;
        var d = document.createElement("small");
        d.textContent = p.date || "";
        b.appendChild(im); b.appendChild(t); b.appendChild(d);
        b.addEventListener("click", function () { zoom(p); });
        box.appendChild(b);
      });
    });
  }

  function zoom(p) {
    var ov = document.createElement("div");
    ov.id = "zoom";
    var im = document.createElement("img");
    im.src = p.img;
    im.alt = p.odai;
    var cap = document.createElement("p");
    cap.textContent = p.odai;
    var close = document.createElement("button");
    close.textContent = "とじる";
    ov.appendChild(im); ov.appendChild(cap); ov.appendChild(close);
    ov.addEventListener("click", function () { ov.remove(); });
    document.body.appendChild(ov);
  }

  /* ========== トースト ========== */
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (toastEl) toastEl.remove();
    if (toastTimer) clearTimeout(toastTimer);
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    toastEl.textContent = msg;
    document.body.appendChild(toastEl);
    toastTimer = setTimeout(function () {
      if (toastEl) { toastEl.remove(); toastEl = null; }
    }, 2200);
  }

  /* さいしょの がめん */
  show("odai");
})();
</script>

</body>
</html>
