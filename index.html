<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#E7EDE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B221C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おえかき">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">

<style>
  :root {
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>おえかきちょう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  :root {
    --bg: #E7EDE3;
    --bg-deep: #DAE3D4;
    --surface: #FFFFFF;
    --paper: #FFFFFF;
    --ink: #2C332C;
    --ink-soft: #6B7568;
    --line: #C7D2C0;
    --crayon: #DD5540;
    --crayon-deep: #B33F2D;
    --ochre: #EDB230;
    --teal: #2F8A86;
    --shadow: rgba(44, 51, 44, 0.16);

    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 11px;

    --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B221C;
      --bg-deep: #141A15;
      --surface: #273027;
      --ink: #E8EFE5;
      --ink-soft: #9DA89A;
      --line: #3B473B;
      --crayon: #F0674F;
      --crayon-deep: #C24630;
      --ochre: #F5C355;
      --teal: #45A9A4;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1B221C;
    --bg-deep: #141A15;
    --surface: #273027;
    --ink: #E8EFE5;
    --ink-soft: #9DA89A;
    --line: #3B473B;
    --crayon: #F0674F;
    --crayon-deep: #C24630;
    --ochre: #F5C355;
    --teal: #45A9A4;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 500;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    padding: 0 12px;
    box-sizing: border-box;
  }

  .view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-block: 10px;
  }

  [hidden] { display: none !important; }

  /* ---- buttons ---- */
  button {
    font-family: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-bottom-width: 4px;
    border-radius: var(--r-md);
    padding: 12px 16px;
    font-size: 17px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .08s ease;
  }
  button:active { transform: translateY(2px); border-bottom-width: 2px; margin-bottom: 2px; }
  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .btn-main {
    background: var(--crayon);
    border-color: var(--crayon-deep);
    color: #FFF8F5;
    font-size: 21px;
    font-weight: 900;
    padding: 16px;
    border-radius: var(--r-lg);
  }

  .btn-row { display: flex; gap: 8px; }
  .btn-row > button { flex: 1; }

  /* ---- top bar ---- */
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
  }
  .bar .spacer { flex: 1; }

  .icon-btn {
    width: 46px;
    height: 46px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 14px;
    flex: 0 0 auto;
  }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.on { background: var(--ochre); border-color: #B8851A; color: #33280A; }

  /* ---- おだい ---- */
  .eyebrow {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--ink-soft);
  }

  .odai-card {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 24px 20px;
    box-shadow: 0 6px 0 var(--shadow);
  }

  .odai-text {
    font-size: clamp(26px, 8.5vw, 38px);
    font-weight: 900;
    line-height: 1.5;
    text-wrap: balance;
    word-break: keep-all;
    overflow-wrap: break-word;
    margin: 0;
  }

  .crayon-strip {
    display: flex;
    gap: 5px;
  }
  .crayon-strip i {
    display: block;
    width: 16px;
    height: 7px;
    border-radius: 4px;
  }

  .app-title {
    font-size: 19px;
    font-weight: 900;
    margin: 0;
  }

  /* ---- おえかき ---- */
  .odai-bar {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .canvas-wrap {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
  }

  canvas#pad {
    max-height: 100%;
    max-width: 100%;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: var(--r-md);
    box-shadow: 0 4px 0 var(--shadow);
    touch-action: none;
    display: block;
  }

  .colors {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 7px;
  }
  .swatch {
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 3px solid var(--surface);
    box-shadow: 0 0 0 2px var(--line);
    padding: 0;
    min-width: 0;
  }
  .swatch[aria-pressed="true"] {
    box-shadow: 0 0 0 3px var(--ink);
    transform: scale(1.08);
  }

  .sizes {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
  }
  .tools {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    align-items: center;
  }
  .tools .icon-btn { width: auto; }
  .size-btn {
    padding: 0;
    height: 46px;
    display: grid;
    place-items: center;
  }
  .size-btn span {
    display: block;
    border-radius: 50%;
    background: var(--ink);
  }
  .size-btn[aria-pressed="true"],
  .brush[aria-pressed="true"] {
    background: var(--bg-deep);
    border-color: var(--ink-soft);
    box-shadow: inset 0 0 0 2px var(--ink);
  }
  .brush-ic { fill: currentColor !important; stroke: none !important; }

  /* ---- ほんだな ---- */
  .shelf-grid {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    align-content: start;
    padding-bottom: 8px;
  }
  .shelf-item {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: var(--r-md);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    box-shadow: 0 3px 0 var(--shadow);
    font: inherit;
    text-align: left;
  }
  .shelf-item img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: var(--r-sm);
    background: var(--paper);
    display: block;
  }
  .shelf-item b {
    word-break: keep-all;
    overflow-wrap: break-word;
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .shelf-item small { font-size: 11px; color: var(--ink-soft); font-weight: 700; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 40px 12px;
    line-height: 1.9;
  }

  /* ---- おおきく みる ---- */
  #zoom {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 21, .82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    z-index: 20;
  }
  .zoom-stage {
    position: relative;
    max-width: 100%;
    max-height: 66%;
    line-height: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .zoom-stage img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    border-radius: var(--r-md);
    background: var(--paper);
    will-change: transform;
  }
  .spark {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    pointer-events: none;
  }
  #zoom p { color: #F4F7F2; font-weight: 900; font-size: 19px; margin: 0; text-align: center; text-wrap: balance; word-break: keep-all; overflow-wrap: break-word; }
  #zoom .hint { font-size: 14px; font-weight: 700; color: #C3CFC4; }
  #zoom .btn-row2 {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    font-weight: 900;
    font-size: 17px;
    padding: 12px 22px;
    border-radius: 999px;
    z-index: 30;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
  }
</style>

</head>
<body>
<div id="app">

  <!-- ===== おだい ===== -->
  <section class="view" id="v-odai">
    <div class="bar">
      <h1 class="app-title">おえかきちょう</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="bgm-1" aria-label="おんがく">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      </button>
      <button class="icon-btn" id="go-shelf-1" aria-label="ほんだな">
        <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      </button>

    <div class="odai-card">

      <p class="odai-text" id="odai-text">まほうを つかう ねこ</p>

        <i style="background:#3E8FD0"></i><i style="background:#8B62C4"></i><i style="background:#E87BA6"></i>
      </div>
    </div>

    <button class="btn-main" id="start-draw">これを かく</button>
    <button id="reroll">べつの おだい</button>
  </section>

  <!-- ===== おえかき ===== -->
  <section class="view" id="v-draw" hidden>
    <div class="bar">
      <button class="icon-btn" id="back-odai" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>

      <span class="odai-bar" id="odai-mini"></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="bgm-2" aria-label="おんがく">
        <svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
      </button>
    </div>

    <div class="canvas-wrap"><canvas id="pad" width="1200" height="1200"></canvas></div>

    <div class="colors" id="colors"></div>

    <div class="sizes" id="sizes"></div>

    <div class="tools">
      <button class="icon-btn brush" data-brush="normal" aria-pressed="true" aria-label="ふつう">
        <svg class="brush-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></svg>
      </button>
      <button class="icon-btn brush" data-brush="soft" aria-pressed="false" aria-label="うすく かく">
        <svg class="brush-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" opacity=".36"/><circle cx="15.5" cy="9.5" r="4.5" opacity=".36"/></svg>
      </button>
      <button class="icon-btn brush" data-brush="spray" aria-pressed="false" aria-label="スプレー">
        <svg class="brush-ic" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="1.5"/><circle cx="8" cy="10" r="1.4"/><circle cx="16" cy="10" r="1.4"/><circle cx="12" cy="12" r="1.7"/><circle cx="6.8" cy="14.5" r="1.2"/><circle cx="17" cy="14.6" r="1.2"/><circle cx="12" cy="16.5" r="1.3"/><circle cx="9" cy="19" r="1.1"/><circle cx="15" cy="19" r="1.1"/></svg>
      </button>
      <button class="icon-btn brush" data-brush="fill" aria-pressed="false" aria-label="ぬりつぶし">
        <svg viewBox="0 0 24 24"><path d="M10.6 2.6 3.9 9.3a1.5 1.5 0 0 0 0 2.1l5.2 5.2a1.5 1.5 0 0 0 2.1 0l6.7-6.7z"/><path d="M8.2 5 5.8 2.6"/><path d="M20.4 14.2s1.7 2.2 1.7 3.4a1.7 1.7 0 0 1-3.4 0c0-1.2 1.7-3.4 1.7-3.4z"/></svg>
      </button>
      <button class="icon-btn" id="eraser" aria-pressed="false" aria-label="けしゴム">
        <svg viewBox="0 0 24 24"><path d="M4 16.5 11.5 9l6 6-4 4H7z"/><path d="M11.5 9 16 4.5a1.5 1.5 0 0 1 2.1 0l3.4 3.4a1.5 1.5 0 0 1 0 2.1L17.5 15"/><path d="M5 20h15"/></svg>
      </button>
      <button class="icon-btn" id="undo" aria-label="ひとつ もどす">
        <svg viewBox="0 0 24 24"><path d="M4 8h10a5 5 0 0 1 0 10H8"/><path d="M8 4 4 8l4 4"/></svg>
      </button>
      <button class="icon-btn" id="clear" aria-label="ぜんぶ けす">
        <svg viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 12h8l1-12"/></svg>
      </button>
    </div>

    <button class="btn-main" id="done">かんせい!</button>
  </section>

  <!-- ===== ほんだな ===== -->
  <section class="view" id="v-shelf" hidden>
    <div class="bar">
      <button class="icon-btn" id="back-odai-2" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="app-title">ほんだな</h1>
      <div class="spacer"></div>
      <span class="eyebrow" id="shelf-count"></span>
    </div>
    <div class="shelf-grid" id="shelf"></div>
  </section>

</div>

    savePic(pic).then(function () {
      chime();
      toast("ほんだなに しまいました");
      strokes = []; redrawAll();
      var next = currentOdai;
      while (next === currentOdai) next = ODAI[Math.floor(Math.random() * ODAI.length)];
      currentOdai = next;
      paintOdai();
      show("shelf");
    });
  });

  /* ========== ほんだな ========== */
  function renderShelf() {
    var box = $("shelf");
    loadPics().then(function (list) {
      list.sort(function (a, b) { return Number(b.id) - Number(a.id); });
      box.textContent = "";
      $("shelf-count").textContent = list.length ? list.length + "まい" : "";

      if (!list.length) {
        var e = document.createElement("div");
        e.className = "empty";
        e.textContent = "まだ 1まいも ありません。おだいの がめんから かいてみよう。";
        box.appendChild(e);
        return;
      }

      list.forEach(function (p) {
        var b = document.createElement("button");
        b.className = "shelf-item";
        var im = document.createElement("img");
        im.src = p.thumb || p.img;
        im.alt = p.odai;
        var t = document.createElement("b");
        t.textContent = p.odai;
        var d = document.createElement("small");
        d.textContent = p.date || "";
        b.appendChild(im); b.appendChild(t); b.appendChild(d);
        b.addEventListener("click", function () { zoom(p); });
        box.appendChild(b);
      });
    });
  }

  function reduceMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  // さわった とき の おと(おんぷボタンが ON の ときだけ)
  function pon() {
    if (!bgmOn) return;
    if (!ensureAudio()) return;
    if (actx.state === "suspended") actx.resume();
    var NOTES = [523.25, 587.33, 659.25, 783.99, 880.00];
    var f = NOTES[Math.floor(Math.random() * NOTES.length)];
    var t = actx.currentTime + 0.01;
    pluck(f, t, 0.55, 0.22);
    pluck(f * 1.5, t + 0.05, 0.42, 0.11);
  }

  // ぷるん と はねる
  function boing(im) {
    if (reduceMotion() || !im.animate) return;
    if (im.getAnimations) {
      im.getAnimations().forEach(function (a) { a.cancel(); });
    }
    im.animate([
      { transform: "scale(1, 1)" },
      { transform: "scale(1.14, 0.86)" },
      { transform: "scale(0.92, 1.10)" },
      { transform: "scale(1.05, 0.96)" },
      { transform: "scale(0.99, 1.01)" },
      { transform: "scale(1, 1)" }
    ], { duration: 560, easing: "ease-out" });
  }

  // さわった ところから つぶが とびちる
  function sparkle(stage, x, y) {
    if (reduceMotion()) return;
    for (var i = 0; i < 13; i++) {
      var sp = document.createElement("i");
      sp.className = "spark";
      sp.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      sp.style.left = (x - 7) + "px";
      sp.style.top = (y - 7) + "px";
      stage.appendChild(sp);
      if (!sp.animate) { sp.remove(); continue; }
      var ang = Math.random() * Math.PI * 2;
      var dist = 55 + Math.random() * 95;
      var a = sp.animate([
        { transform: "translate(0, 0) scale(1)", opacity: 1 },
        {
          transform: "translate(" + (Math.cos(ang) * dist).toFixed(1) + "px, " +
            (Math.sin(ang) * dist).toFixed(1) + "px) scale(0.25)",
          opacity: 0
        }
      ], { duration: 560 + Math.random() * 320, easing: "cubic-bezier(.2,.7,.3,1)" });
      (function (el) { a.onfinish = function () { el.remove(); }; })(sp);
    }
  }

  // データURL を ファイルの かたち に なおす
  function dataURLtoBlob(u) {
    var parts = u.split(",");
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/png";
    var bin = atob(parts[1]);
    var n = bin.length;
    var arr = new Uint8Array(n);
    while (n--) arr[n] = bin.charCodeAt(n);
    return new Blob([arr], { type: mime });
  }

  // しゃしんに ほぞん(iPhone は きょうゆうシート から「画像を保存」)
  function savePhoto(p) {
    var name = "oekaki-" + p.id + ".png";
    var file = null;
    try {
      file = new File([dataURLtoBlob(p.img)], name, { type: "image/png" });
    } catch (e) {
      file = null;
    }

    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: p.odai })["catch"](function () {
        // やめた ときは なにも しない
      });
      return;
    }

    // きょうゆうシートが つかえない ときは ダウンロード
    try {
      var a = document.createElement("a");
      a.href = p.img;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("がぞうを ほぞん しました");
    } catch (e2) {
      toast("この ブラウザでは ほぞん できません");
    }
  }

  function zoom(p) {
    var ov = document.createElement("div");
    ov.id = "zoom";

    var stage = document.createElement("div");
    stage.className = "zoom-stage";
    var im = document.createElement("img");
    im.src = p.img;
    im.alt = p.odai;
    im.draggable = false;
    stage.appendChild(im);

    var cap = document.createElement("p");
    cap.textContent = p.odai;

    var hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = "えを さわると うごくよ";

    var save = document.createElement("button");
    save.textContent = "しゃしんに ほぞん";

    var close = document.createElement("button");
    close.textContent = "とじる";

    var row = document.createElement("div");
    row.className = "btn-row2";
    row.appendChild(save);
    row.appendChild(close);

    ov.appendChild(stage);
    ov.appendChild(cap);
    ov.appendChild(hint);
    ov.appendChild(row);

    save.addEventListener("click", function () { savePhoto(p); });

    stage.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      var r = stage.getBoundingClientRect();
      boing(im);
      sparkle(stage, e.clientX - r.left, e.clientY - r.top);
      pon();
    });

    // とじるのは ボタンだけ。まちがって けしてしまわないように
    close.addEventListener("click", function () { ov.remove(); });

    document.body.appendChild(ov);
  }

  /* ========== トースト ========== */
  var toastEl = null, toastTimer = null;
  function toast(msg) {
    if (toastEl) toastEl.remove();
    if (toastTimer) clearTimeout(toastTimer);
    toastEl = document.createElement("div");
    toastEl.className = "toast";
    toastEl.textContent = msg;
    document.body.appendChild(toastEl);
    toastTimer = setTimeout(function () {
      if (toastEl) { toastEl.remove(); toastEl = null; }
    }, 2200);
  }

  /* さいしょの がめん */
  show("odai");
})();
</script>
